[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-todo"
version = "0.1.0"
description = "A clean PySide6 TODO app with system tray integration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
snake-todo = "snake_todo.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"snake_todo" = ["resources/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"