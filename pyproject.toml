[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-snake"
version = "0.3.1"
description = "A clean PySide6 TODO app with system tray integration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Felix Müller" }]
keywords = [
    "todo",
    "tasks",
    "pyside6",
    "qt",
    "system-tray",
    "nextcloud",
    "caldav",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "PySide6>=6.11.2,<6.12",
]

[project.urls]
Homepage = "https://github.com/SpotlightOn/todo-snake"
Repository = "https://github.com/SpotlightOn/todo-snake"
Issues = "https://github.com/SpotlightOn/todo-snake/issues"
Changelog = "https://github.com/SpotlightOn/todo-snake/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[project.scripts]
todo-snake = "todo_snake.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"todo_snake" = ["resources/icons/*.svg", "resources/i18n/*.qm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"