[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-snake"
version = "0.1.0"
description = "A clean PySide6 TODO app with system tray integration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
todo-snake = "todo_snake.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"todo_snake" = ["resources/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"